name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platforms;android-37.0'

      - uses: gradle/actions/setup-gradle@v6.2.0

      - run: ./gradlew :apifier:testDebugUnitTest

  # Tag + release when the published version has no matching tag yet.
  # Runs only after the test job passes, and never on pull requests.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history so the tag-existence check can see every tag.
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - id: ver
        run: |
          VERSION=$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' apifier/build.gradle.kts \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not resolve version from apifier/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists, skipping the release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $VERSION, releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --title "${{ steps.ver.outputs.version }}" \
            --target "${{ github.sha }}" \
            --generate-notes
